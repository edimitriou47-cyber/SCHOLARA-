 $("#disc").textContent=t("dsc")+P.discounts.map(d=>d.minPages+"+ → -"+d.pct+"%").join(" · ")+" — "+t("big")+" Priority +"+P.delivery.priority+"%, Express +"+P.delivery.express+"%.";
 const sv=SK.map(k=>[k,t("sv")[k][0]]),dl=Object.keys(P.delivery).map(k=>[k,t("dl")[k]+(P.delivery[k]?" +"+P.delivery[k]+"%":"")]);
 [$("#cS"),$("#uS")].forEach(s=>opts(s,sv,1));[$("#cD"),$("#uD")].forEach(s=>opts(s,dl,1));opts($("#fT"),t("types").map(x=>[x,x]),1);
 $("#steps").innerHTML=t("steps").map((s,i)=>`<div>${String(i+1).padStart(2,"0")}<br>${s}</div>`).join("");
 $("#faqL").innerHTML=t("faq").map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("");
 plans();tc();upd();reviews();document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L))}
function upd(){const r=calc(+$("#cW").value,$("#cS").value,$("#cD").value);$("#expNote").hidden=$("#cD").value!=="express";
 $("#cP").textContent=!r?"—":r.custom?t("custom"):eur(r.tot);
 $("#cB").textContent=!r||r.custom?"":(P.services[$("#cS").value]?`${(+$("#cW").value).toLocaleString()} ÷ ${P.wordsPerPage} = ${r.pages} · ${r.pages} × ${eur(P.services[$("#cS").value].rate)}`+(r.pct?` · -${r.pct}%`:""):"");
 const u=calc(+$("#uW").value,$("#uS").value,$("#uD").value);
 $("#sW").textContent=$("#uW").value?(+$("#uW").value).toLocaleString()+" "+t("words"):"—";
 $("#sS").textContent=t("sv")[$("#uS").value][0];$("#sP").textContent=u?u.pages+" "+t("pages"):"";
 $("#sE").textContent=!u?"—":u.custom?t("custom"):eur(u.tot)}
/* PayPal plans: config in pricing.config.js (window.PAYPAL, window.PLANS) */
let ppP;function loadPP(){const C=window.PAYPAL||{};if(!C.clientId||/YOUR/.test(C.clientId))return Promise.resolve(false);
 if(ppP)return ppP;ppP=new Promise(r=>{const s=document.createElement("script"),sub=C.mode!=="order";
  s.src="https://www.paypal.com/sdk/js?client-id="+encodeURIComponent(C.clientId)+"&currency="+(C.currency||"EUR")+(sub?"&vault=true&intent=subscription":"");
  s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)});return ppP}
function plans(){const A=window.PLANS||[];
 $("#plL").innerHTML=A.map(p=>`<div class="plan"><small>${esc((p.tag&&p.tag[L])||"")}</small><h3>${esc(p.name[L])}</h3><div class="pp">${eur(p.price)}<span>${esc((p.per&&p.per[L])||"")}</span></div><p>${esc(p.desc[L])}</p><div id="pp-${esc(p.id)}"></div></div>`).join("");
 loadPP().then(ok=>A.forEach(p=>mountPP(p,ok)))}
function mountPP(p,ok){const el=document.getElementById("pp-"+p.id);if(!el)return;const soon=`<p class="warn">${t("ppSoon")}</p>`;
 if(!ok||!window.paypal){el.innerHTML=soon;return}
 const C=window.PAYPAL,sub=C.mode!=="order";el.innerHTML="";
 const cfg={style:{layout:"vertical",shape:"pill",label:sub?"subscribe":"pay"},
  onApprove:(d,a)=>sub?donePP(p):a.order.capture().then(()=>donePP(p)),
  onError:()=>el.insertAdjacentHTML("beforeend",`<p class="warn" style="color:#e5736b">${t("ppErr")}</p>`)};
 if(sub){if(!p.planId||/XXXX/.test(p.planId)){el.innerHTML=soon;return}cfg.createSubscription=(d,a)=>a.subscription.create({plan_id:p.planId})}
 else cfg.createOrder=(d,a)=>a.order.create({purchase_units:[{description:p.name.en,amount:{value:(+p.price).toFixed(2),currency_code:C.currency||"EUR"}}]});
 window.paypal.Buttons(cfg).render(el)}
function donePP(p){document.getElementById("pp-"+p.id).innerHTML=`<p style="color:var(--gold)">${t("ppOk")}</p>`}
let showO=0;function tc(){const e=$("#tc");e.className="tc"+(showO?" o":"");e.innerHTML=(showO?t("orig"):t("ed"))+(showO?"":`<span class="cm">${t("cm")}</span>`);$("#tgl").textContent=showO?t("showE"):t("showO")}
$("#tgl").onclick=()=>{showO^=1;tc()};
/* reviews: localStorage demo. Replace with POST /api/reviews (see server/README) */
function rvs(){try{return JSON.parse(localStorage.getItem("reviews")||"[]")}catch{return[]}}
function reviews(){const a=rvs();const m=a.length?a.reduce((s,r)=>s+r.r,0)/a.length:0;
 $("#avg").textContent=a.length?"★ "+m.toFixed(1)+" / 5":"★ — / 5";
 $("#rvl").innerHTML=a.length?a.map(r=>`<div class="rv"><b>${"★".repeat(r.r)}</b> ${esc(r.n||t("anon"))}<p>${esc(r.t)}</p></div>`).join(""):`<p class="warn">${t("noRv")}</p>`}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#st").innerHTML=[1,2,3,4,5].map(i=>`<button type="button" data-r="${i}" aria-label="${i}">★</button>`).join("");
$("#st").onclick=e=>{if(!e.target.dataset.r)return;rating=+e.target.dataset.r;[...$("#st").children].forEach((b,i)=>b.classList.toggle("on",i<rating))};
$("#rf").onsubmit=e=>{e.preventDefault();const f=e.target;if(!rating||!f.t.value.trim()){$("#re").textContent=t("rErr");return}
 const a=rvs();a.push({r:rating,t:f.t.value.trim(),n:f.n.value.trim()});localStorage.setItem("reviews",JSON.stringify(a));f.reset();rating=0;[...$("#st").children].forEach(b=>b.classList.remove("on"));$("#re").textContent=t("rOk");reviews()};
/* upload */
const ok=n=>/\.(docx|pdf|odt)$/i.test(n),drop=$("#drop");
function setF(f){if(!f)return;if(f.size>4*1024*1024){$("#fe").textContent=t("big4");return}if(!ok(f.name)){$("#fe").textContent=t("badFile");return}$("#fe").textContent="";file=f;$("#fn").textContent=f.name}
drop.onclick=()=>$("#file").click();drop.onkeydown=e=>e.key==="Enter"&&$("#file").click();$("#file").onchange=e=>setF(e.target.files[0]);
["dragover","dragenter"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add("hv")}));
["dragleave","drop"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove("hv")}));drop.addEventListener("drop",e=>setF(e.dataTransfer.files[0]));
$("#f").oninput=upd;["cW","cS","cD"].forEach(i=>$("#"+i).oninput=upd);
$("#f").onsubmit=async e=>{e.preventDefault();const f=e.target;let bad=0;
 [["name",v=>v.trim()],["email",v=>/^\S+@\S+\.\S+$/.test(v)],["words",v=>+v>0]].forEach(([n,fn])=>{const el=f[n],er=el.nextElementSibling;const g=fn(el.value);er.textContent=g?"":(n==="email"&&el.value?t("badMail"):t("need"));if(!g)bad=1});
 if(bad)return;const fd=new FormData(f);if(file)fd.append("file",file);
 const b=f.querySelector("button");b.disabled=true;$("#ok").textContent="…";
 try{const r=await fetch("/api/quote",{method:"POST",body:fd});$("#ok").textContent=r.ok?t("sent"):(r.status===413?t("big4"):t("fail"));if(r.ok){f.reset();file=null;$("#fn").textContent="";upd()}}
 catch{$("#ok").textContent=t("fail")}b.disabled=false};
/* nav, lang, reveal, parallax */
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem("lang",L);render()});
addEventListener("scroll",()=>$("#nav").classList.toggle("s",scrollY>40),{passive:true});
$("#burger").onclick=()=>$("#nav").classList.toggle("open");document.querySelectorAll(".links a").forEach(a=>a.onclick=()=>$("#nav").classList.remove("open"));
new IntersectionObserver((es,o)=>es.forEach(e=>e.isIntersecting&&(e.target.classList.add("in"),o.unobserve(e.target)))).observe($("#t4"));
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")));io.observe($("#steps"));
if(matchMedia("(pointer:fine)").matches)$("#top").addEventListener("mousemove",e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
 document.querySelectorAll(".pg").forEach(p=>{const d=+p.dataset.d;p.style.marginLeft=-150+x*d*2+"px";p.style.marginTop=-200+y*d+"px"})});
render();
